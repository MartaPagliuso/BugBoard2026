<div class="fixed top-16 left-1/2 -translate-x-2.5 z-50 flex-col items-center gap-2 pointer-events-none">
  @for(t of toasts(); track t.id) {
    <div [class]="t.type === 'success' ? 'bg-green-50 border-green-200 text-green-900' : 'bg-red-50 border-red-200 text-red-900'"
      class="border rounded-lg px-3.5 py-2.5 shadow-sm flex items-start gap-2.5 pointer-events-auto max-w-sm">

      @if(t.type === 'success') {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" class="text-green-700 shrink-0 mt-0.5">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" class="text-red-700 shrink-0 mt-0.5">
          <circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" />
        </svg>
      }

      <span class="text-[13px] flex-1">{{ t.message }}</span>
      
      <button type="button" (click)="dismiss(t.id)" aria-label="Chiudi" class="shrink-0 opacity-60 hover:opacity-100 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6 6 18" /><path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
  }
</div>
