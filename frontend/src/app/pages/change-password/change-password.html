<div class="min-h-screen flex items-center justify-center bg-blue-50 px-4">
  <div class="w-full max-w-sm">

    <!-- SEZIONE DELL'ICONA PRINCIPALE -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-plum-600 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 2 1.88 1.88" /><path d="M14.12 3.88 16 2" />
          <path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1" />
          <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6" />
          <path d="M12 20v-9" /><path d="M6.53 9C4.6 8.8 3 7.1 3 5" />
          <path d="M6 13H2" /><path d="M3 21c0-2.1 1.7-3.9 3.8-4" />
          <path d="M20.97 5c0 2.1-1.6 3.8-3.5 4" />
          <path d="M22 13h-4" /><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4" />
        </svg>
      </div>
      <h1 class="text-2xl font-medium text-ink mb-1"> Imposta una nuova password</h1>
      <p class="text-sm text-ink-mid"> {{ currentUser()?.email }}</p>
    </div>

    <!-- SEZIONE MESSAGGIO DI SPIEGAZIONE -->
    <div class="flex gap-2 items-start bg-amber-50 rounded-lg px-3 mb-4 p-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="text-amber-800 shrink-0 mt-0.5">
        <path d="M12 9v4" />
        <path d="M10.363 3.591 2.257 17.125a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636-2.87L13.637 3.59a1.914 1.914 0 0 0-3.274 0" />
        <path d="M12 16h.01" />
      </svg>
      <p class="text-sm text-amber-800 leading-snug"> Stai usando una password temporanea. Cambiala per accedere al sistema. </p>
    </div>

    <!-- SEZIONE FORM -->
    <form (ngSubmit)="submit()" class="bg-white border border-line rounded-xl p-5">
      <!-- SEZIONE PASSWORD ATTUALE -->
      <label for="current" class="block text-sm text-ink mb-1.5"> Password Attuale </label>
      <div class="relative mb-4">
        <input id="current" name="current" autocomplete="current-password"
          [type]="showCurrent() ? 'text' : 'password' "
          [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)"
          class="w-full border border-line rounded-lg px-3 py-2 pr-10 text-sm outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">
        
        <!-- BOTTONE PER NASCONDERE O MOSTRARE LA PASSWORD CORRENTE -->
        <button type="button" (click)="showCurrent.set(!showCurrent())"
          [attr.aria-label]="showCurrent() ? 'Nascondi password' : 'Mostra password' "
          class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-mid hover:text-blue-700 cursor-pointer transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <!-- SEZIONE NUOVA PASSWORD -->
      <label for="new" class="block text-sm text-ink mb-1.5"> Nuova Password </label>
      <div class="relative mb-2.5">
        <input id="new" name="new" autocomplete="new-password"
          [type]="showNew() ? 'text' : 'password' "
          [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)"
          class="w-full border border-line rounded-lg px-3 py-2 pr-10 text-sm outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">

        <!-- BOTTONE PER NASCONDERE O MOSTRARE LA NUOVA PASSWORD -->
        <button type="button" (click)="showNew.set(!showNew())"
          [attr.aria-label]="showNew() ? 'Nascondi password' : 'Mostra password' "
          class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-mid hover:text-blue-700 cursor-pointer transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <div class="flex flex-col gap-1.5 mb-4">
        <!-- SEZIONE CHE CONTROLLA SE LA NUOVA PASSWORD È ABBASTANZA LUNGA -->
        <div class="flex items-center gap-2">
          <span [class]="isLongEnough() ? 'text-green-700' : 'text-gray-400' ">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              @if (isLongEnough()) { <path d="M20 6 9 17l-5-5" /> } @else { <circle cx="12" cy="12" r="9" /> }
            </svg>
          </span>

          <span class="text-xs" [class]="isLongEnough() ? 'text-green-700' : 'text-gray-400'">
            Almeno 8 caratteri
          </span>
        </div>

        <!-- SEZIONE CHE CONTROLLA SE LA NUOVA PASSWORD È DIVERSA DALLA PRECEDENTE -->
        <div class="flex items-center gap-2">
          <span [class]="isDifferent() ? 'text-green-700' : 'text-gray-400'">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              @if (isDifferent()) { <path d="M20 6 9 17l-5-5" /> } @else { <circle cx="12" cy="12" r="9" /> }
            </svg>
          </span>
          <span class="text-xs" [class]="isDifferent() ? 'text-green-700' : 'text-gray-400' ">
            Diversa da quella attuale
          </span>
        </div>
      </div>

      <!-- SEZIONE DI CONFERMA DELLA NUOVA PASSWORD  -->
      <label for="confirm" class="block text-sm text-ink mb-1.5"> Conferma nuova password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password"
        [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
        placeholder="Ripeti la nuova password"
        class="w-full border border-line rounded-lg px-3 py-2 mb-1 text-sm outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">
      
      @if (confirmPassword() && !matches()) {
        <p class="text-xs text-red-700 mb-3"> Le password non coincidono</p>
      } @else {
        <div class="mb-4"></div>
      }

      @if (error()) {
        <p role="alert" class="text-sm text-red-800 bg-red-50 rounded-lg px-3 py-2 mb-4">{{ error() }}</p>
      }

      <!-- BOTTONE PER INVIARE IL FORM  -->
      <button type="submit" [disabled]="!canSubmit()"
        class="w-full bg-plum-600 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-plum-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
        {{ loading() ? 'Aggiornamento...' : 'Aggiorna Password' }}
      </button>
    </form> 
  </div>
</div>
