<div class="min-h-screen flex items-center justify-center bg-blue-50 px-40">
  <div class="w-full max-w-sm">
    
    <div class="text-center mb-7">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-plum-600 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 2 1.88 1.88" /><path d="M14.12 3.88 16 2" />
          <path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1" />
          <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6" />
          <path d="M12 20v-9" /><path d="M6.53 9C4.6 8.8 3 7.1 3 5" />
          <path d="M6 13H2" /><path d="M3 21c0-2.1 1.7-3.9 3.8-4" />
          <path d="M20.97 5c0 2.1-1.6 3.8-3.5 4" />
          <path d="M22 13h-4" /><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4" />
        </svg>
      </div>
      <h1 class="text-2xl font-medium text-ink mb-1">BugBoard</h1>
      <p class="text-sm text-ink-mid">Sistema interno di segnalazioni</p>
    </div>

    <form (ngSubmit)="submit()" class="bg-white border border-line rounded-xl p-6">
      <label for="email" class="block text-sm text-ink mb-1.5"> Email Aziendale </label>
      <input id="email" type="email" name="email" autocomplete="username"
        [ngModel]="email()" (ngModelChange)="email.set($event)"
        placeholder="nome.cognome@bugboard.it"
        class="w-full border border-line rounded-lg px-3 py-2 mb-4 text-sm outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400"/>

      <label for="password" class="block text-sm text-ink mb-1.5"> Password </label>
      <div class="relative mb-5">
        <input id="password" name="password" autocomplete="current-password"
          [type]="showPassword() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          class="w-full border border-line rounded-lg px-3 py-2 pr-10 text-sm outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">

        <button type="button" (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Nascondi Password' : 'Mostra Password' "
          class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-mid hover:text-blue-700 cursor-pointer transition-colors">
          @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>

      @if(error()) {
        <p role="alert" class="text-sm text-red-800 bg-red-50 rounded-lg px-3 py-2 mb-4">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading() || !email() || !password()"
        class="w-full bg-plum-600 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-plum-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
        {{loading() ? 'Accesso in corso...' : 'Accedi' }}
      </button>
    </form>

    <p class="text-xs text-ink-mid text-center mt-4 leading-relaxed">
      Gli account sono creati dagli amministratori. <br> Contatta il tuo referente per l'accesso.
    </p>
  </div>
</div>
